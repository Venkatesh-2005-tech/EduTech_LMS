<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EduTech</title>
    <link rel="stylesheet" href="style.css">
    <!-- Required so auth.js doesn't crash on load -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

   <div class="auth-body">
        <div class="auth-card">
            <!-- Exact same header as login page -->
            <h2 style="margin: 0; color: #0f2e21; font-size: 24px; font-weight: 700;">Edu<span style="color: #2e8b57;">Tech</span></h2>
            <p>Reset your password.</p>

            <!-- Step 1: Enter Email -->
            <div id="reset-step-1">
                <label for="resetEmail">Registered Email Address</label>
                <input type="email" id="resetEmail" placeholder="jane@example.com" required>

                <button class="btn-primary auth-btn" onclick="sendResetOTP()">Send Reset OTP</button>
                
                <p style="margin-top: 15px; text-align: center; font-size: 14px;">
                    <a href="login.html" style="color: #007bff; text-decoration: none;">Back to Login</a>
                </p>
            </div>

            <!-- Step 2: Verify OTP & New Password (Hidden initially) -->
            <div id="reset-step-2" style="display: none;">
                <label for="resetOtpInput">Enter OTP from Email</label>
                <input type="text" id="resetOtpInput" placeholder="4-digit code" required>

                <label for="newPassword">Create New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>

                <button class="btn-primary auth-btn" onclick="verifyResetOTP()">Update Password</button>
            </div>
        </div>
   </div>
 
   <script src="auth.js"></script>
</body>
</html>
