<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduTech</title>
    <link rel="stylesheet" href="style.css">

    <!-- 1. EmailJS Library FIRST -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <!-- 2. Config File ONCE -->
    <script src="config.js"></script>

    <!-- 3. Auth Logic -->
    <script src="auth.js" defer></script>
    
    <style>
        /* --- MOBILE RESPONSIVENESS (DESKTOP VIEW UNTOUCHED) --- */
        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }
            .auth-body {
                padding: 15px !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
                min-height: 100vh !important;
            }
            .auth-card {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 auto !important;
                padding: 25px 20px !important;
                box-sizing: border-box !important;
            }
            .floating-group input {
                width: 100% !important;
                box-sizing: border-box !important;
            }
            h2 {
                font-size: 22px !important;
            }
        }
    </style>
</head>
<body>
<!-- Splash Screen -->
<div id="splash-screen">
    <h1 class="splash-logo">Edu<span>Tech</span></h1>
</div>
   <!-- This wrapper will center the card on the screen -->
   <div class="auth-body">

        <div class="auth-card">
            <h2 style="margin: 0; color: #0f2e21; font-size: 24px; font-weight: 700;">Edu<span style="color: #2e8b57;">Tech</span></h2>
            <p>Start your Tech journey today.</p>

            <!-- STEP 1: Name, Email & Password -->
            <div id="step-1">
                <!-- Floating Input 1 -->
                <div class="floating-group">
                    <input type="text" id="userName" placeholder=" " required>
                    <label for="userName">Full Name</label>
                </div>

                <!-- Floating Input 2 -->
                <div class="floating-group">
                    <input type="email" id="userEmail" placeholder=" " required>
                    <label for="userEmail">Email Address</label>
                </div>

                <!-- Floating Input 3 -->
                <div class="floating-group">
                    <input type="password" id="userPassword" placeholder=" " required>
                    <label for="userPassword">Create Password</label>
                </div>
                
                <button type="button" class="btn-primary auth-btn btn-3d" onclick="sendOTP()">Send OTP</button>
                <br>
                <p class="login-link"> Have an Account? <a href="login.html"> Login here </a></p>
            </div>

            <!-- STEP 2: OTP Verification (Hidden by default) -->
            <div id="step-2" style="display: none;">
                <p class="otp-message" style="margin-bottom: 20px; color: #2e8b57; font-weight: 600;">An OTP has been sent to your email!</p>
                
                <!-- Floating Input OTP -->
                <div class="floating-group">
                    <input type="text" id="otpInput" placeholder=" " maxlength="4">
                    <label for="otpInput">Enter 4-Digit OTP</label>
                </div>

                <button type="button" class="btn-primary auth-btn btn-3d" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
   </div>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
        }, 3000); 
    });
</script>
</body>
</html>
