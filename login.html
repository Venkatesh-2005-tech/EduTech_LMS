<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTech</title>
    <link rel="stylesheet" href="style.css">
    <!-- Required so auth.js doesn't crash on load -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

   <div class="auth-body">
        <div class="auth-card">
            <h2 style="margin: 0; color: #0f2e21; font-size: 24px; font-weight: 700;">Edu<span style="color: #2e8b57;">Tech</span></h2>
            <p>Welcome! Please log in.</p>

            <div id="login-form">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="jane@example.com" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <button class="btn-primary auth-btn" onclick="loginUser()">Log In</button>
            </div>
            
            <p style="margin-top: 15px; text-align: center; font-size: 14px;">
                Don't have an account? <a href="register.html" style="color: #007bff;">Sign up here</a>
            </p>
        </div>
   </div>
 
   <script src="auth.js"></script>
</body>
</html>
